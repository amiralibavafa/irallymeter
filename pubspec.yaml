name: irallymeter
description: "Rally-grade co-driver speedometer and trip computer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local storage (no codegen — primitives + JSON)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # GPS
  geolocator: ^13.0.2

  # Maps (offline-capable)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sensors / compass
  sensors_plus: ^6.1.1

  # Permissions
  permission_handler: ^11.3.1

  # Keep the screen awake while the cluster is in use
  wakelock_plus: ^1.2.8

  # Formatting + file sharing
  # NOTE: `intl` was removed in [SA-V2] — it was declared here and imported
  # nowhere in lib/, test/ or tool/. Add it back when localisation lands
  # (docs/IRAN-CONSTRAINTS.md §6), not before.
  share_plus: ^10.1.3
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
