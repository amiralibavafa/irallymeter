name: irallymeter
description: "Rally-grade co-driver speedometer and trip computer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local storage (no codegen — primitives + JSON)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # GPS
  geolocator: ^13.0.2

  # Maps (offline-capable)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sensors / compass
  sensors_plus: ^6.1.1

  # Permissions
  permission_handler: ^11.3.1

  # Keep the screen awake while the cluster is in use
  wakelock_plus: ^1.2.8

  # Formatting + file sharing
  # NOTE: `intl` was removed in [SA-V2] — it was declared here and imported
  # nowhere in lib/, test/ or tool/. Add it back when localisation lands
  # (docs/IRAN-CONSTRAINTS.md §6), not before.
  share_plus: ^10.1.3
  file_picker: ^8.1.6

  # ── The account gate (SPEC.md §6). Added in [SA-V4 phase-3]. ──────────────
  # These three are the ONLY runtime dependencies the gate adds, and none of
  # them is reachable from the rally computer. GPS, distance, the trip meters
  # and the compass keep running with the network down, which is the point of
  # SPEC.md §4: "the speedometer never awaits a network call".
  #
  # `http` was already resolved transitively, so declaring it costs no package.
  http: ^1.2.2
  # The installation UUID and the refresh token live HERE, never in Hive. Hive
  # is unencrypted, so a token in it is readable by anything that can read the
  # app's files.
  flutter_secure_storage: ^10.3.1
  # Ed25519 verification of the offline entitlement blob (INTERFACES.md §5),
  # and nothing else. Pure Dart, so it verifies with no network and no
  # platform channel — the valley case this whole blob exists for.
  cryptography: ^2.9.0
  # The handset's model name, for ONE purpose: INTERFACES.md §3 requires the
  # DEVICE_CONFLICT screen to carry a name that is "enough to let a person
  # recognise their own other phone". No plugin-free Dart API returns a model
  # name — `Platform.operatingSystemVersion` gives "Android 14 (API 34)", which
  # would make every conflict screen identical and useless.
  device_info_plus: ^11.2.0
  # Opens the ZarinPal payment page in the system browser. INTERFACES.md §7
  # makes the gateway an EXTERNAL redirect that comes back through the
  # irallymeter:// deep link, so there is no in-app path that avoids this.
  # Its three desktop platform packages were already in the tree via
  # share_plus / file_picker; only the plugin itself is new.
  url_launcher: ^6.3.1
  # ⚠ PINNED BELOW 6.3.26, AND THE REASON IS A BUILD THE TEST SUITE CANNOT SEE.
  # 6.3.26 raised androidx.core to 1.17.0 and a later release raised
  # androidx.browser to 1.9.0; both require Android Gradle Plugin 8.9.1, and
  # this project builds with AGP 8.6.0. `flutter test` and `flutter analyze`
  # never run Gradle, so the unpinned version passed both — 488/1/0, analyze 2 —
  # while `flutter build apk` failed at checkDebugAarMetadata. Pinning the one
  # plugin is surgical; bumping AGP would change the build for the whole app.
  # Lift this pin only in the same change that upgrades AGP to >= 8.9.1.
  url_launcher_android: ">=6.3.0 <6.3.26"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Stage 3. Drives the REAL app on a device: real Hive, real go_router, real
  # platform channels. Everything in test/ runs against a fake of at least one
  # of those.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
