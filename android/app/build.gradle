plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.irallyclub.irallymeter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.irallyclub.irallymeter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // geolocator + foreground-service location require a modern min SDK.
        //
        // Pinned to 23 ON PURPOSE. Do not replace this with
        // `flutter.minSdkVersion`: that resolves to 24 in Flutter 3.44, which
        // silently drops Android 6.0 (Marshmallow) devices. This app ships to
        // Iran, where older handsets are common, so the floor is a product
        // decision rather than a toolchain default. Flutter's Android migrator
        // rewrites this line on build if given the chance.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Present only when android/key.properties exists. That file and the
            // keystore are BOTH gitignored, so a clone builds fine and simply
            // falls back to debug signing rather than failing.
            if (keystoreProperties['storeFile'] != null) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // REAL SIGNING when the key is available, debug otherwise.
            //
            // It was `signingConfigs.debug` unconditionally. That is fine for
            // sideloading and fatal for everything else: every store rejects a
            // debug-signed APK, and an app first installed under the debug key
            // CANNOT be updated with a real one — Android refuses, so the only
            // way through is uninstall, which wipes every saved trip.
            //
            // ⚠ THE KEYSTORE CANNOT BE REPLACED LATER WITHOUT THAT SAME WIPE,
            // and if it is lost the app can never be updated again. See
            // docs/SIGNING.md.
            // FAIL CLOSED. This used to fall back to debug signing when the
            // key was missing, which made a SUCCESSFUL release build unsafe to
            // distribute: it looked like a release, installed like a release,
            // and then could never be updated with the real key without every
            // tester uninstalling and losing their trips.
            //
            // A missing key is now a build error. Developers who do not have it
            // can still use debug builds, which is what they want anyway; the
            // only thing that breaks is producing a release nobody can update.
            if (keystoreProperties['storeFile'] == null) {
                throw new GradleException(
                    "Release build requires android/key.properties. See docs/SIGNING.md. " +
                    "Use a debug build if you do not have the signing key.")
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

// ⚠ THE REAL FLOOR IS 24, AND ANDROID 6 IS NOT AVAILABLE. Pinned here because
// Flutter's Android migrator rewrites `defaultConfig` on every native build.
//
// The source said `minSdk = 23` and a long comment above it called that a
// deliberate product decision for older Iranian handsets. IT WAS NEVER TRUE OF
// ANY BUILD. Forcing 23 fails the manifest merge outright:
//
//   uses-sdk:minSdkVersion 23 cannot be smaller than version 24 declared in
//   library [:geolocator_android]
//
// So geolocator_android sets the floor, not us, and every APK ever produced
// declared 24. The migrator rewriting the line to `flutter.minSdkVersion` was
// masking a constraint rather than causing one.
//
// ⚠ THIS IS A PRODUCT FACT FOR AMIRALI: Android 6.0 devices cannot run this
// app. Changing that means downgrading geolocator, which would give back the
// GPS defects this revision exists to fix. Stated explicitly so nobody
// "restores" a 23 that has never worked.
//
// VERIFY the built artifact, never the source:
//   aapt2 dump badging build/app/outputs/flutter-apk/app-release.apk | grep minSdk
android.defaultConfig.minSdkVersion = 24
