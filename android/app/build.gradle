plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.irallyclub.irallymeter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.irallyclub.irallymeter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // geolocator + foreground-service location require a modern min SDK.
        //
        // Pinned to 23 ON PURPOSE. Do not replace this with
        // `flutter.minSdkVersion`: that resolves to 24 in Flutter 3.44, which
        // silently drops Android 6.0 (Marshmallow) devices. This app ships to
        // Iran, where older handsets are common, so the floor is a product
        // decision rather than a toolchain default. Flutter's Android migrator
        // rewrites this line on build if given the chance.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Present only when android/key.properties exists. That file and the
            // keystore are BOTH gitignored, so a clone builds fine and simply
            // falls back to debug signing rather than failing.
            if (keystoreProperties['storeFile'] != null) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // REAL SIGNING when the key is available, debug otherwise.
            //
            // It was `signingConfigs.debug` unconditionally. That is fine for
            // sideloading and fatal for everything else: every store rejects a
            // debug-signed APK, and an app first installed under the debug key
            // CANNOT be updated with a real one — Android refuses, so the only
            // way through is uninstall, which wipes every saved trip.
            //
            // ⚠ THE KEYSTORE CANNOT BE REPLACED LATER WITHOUT THAT SAME WIPE,
            // and if it is lost the app can never be updated again. See
            // docs/SIGNING.md.
            signingConfig = keystoreProperties['storeFile'] != null
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
